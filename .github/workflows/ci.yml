# Checks for pull requests and for main: language parity, build, SEO check,
# internal link check, accessibility and service finder tests.
# Deployment is done by Cloudflare Workers Builds (docs/cloudflare.md), which
# runs scripts/build-cloudflare.sh; these checks are required for merging
# into main by branch protection.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  HUGO_VERSION: 0.166.0   # keep in sync with .hugo-version and hugo.toml

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history for enableGitInfo (last-updated dates)

      - name: Language parity check
        run: node scripts/check-language-parity.mjs

      - name: Install Hugo (extended)
        run: |
          wget -nv -O "${RUNNER_TEMP}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${RUNNER_TEMP}/hugo.deb"
          hugo version

      - name: Build
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --gc --printPathWarnings

      - name: SEO and structured data check
        run: node scripts/check-seo.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: public
          path: public
          retention-days: 3

  linkcheck:
    name: link check
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: public
          path: public

      # Internal links only (blocking). External links are checked by the
      # scheduled workflow linkcheck-external.yml so that an unreachable
      # third-party site does not block merges.
      - name: Check internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --no-progress
            --include-fragments
            --root-dir "${{ github.workspace }}/public"
            "public/**/*.html"
          fail: true

  browser-checks:
    name: accessibility
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: public
          path: public
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: axe (WCAG 2.1 AA), all pages, light and dark
        run: npm run check:a11y
      - name: Service finder (with and without JavaScript)
        run: npm run test:finder
